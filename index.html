<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bad Clock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="masthead">
  <svg class="dial" viewBox="0 0 200 200" aria-hidden="true">
    <circle class="dial-face" cx="100" cy="100" r="96"/>
    <g id="dialTicks"></g>
    <line id="hourHand" class="hand hand-hour" x1="100" y1="114" x2="100" y2="52"/>
    <line id="minuteHand" class="hand hand-minute" x1="100" y1="116" x2="100" y2="26"/>
    <line id="secondHand" class="hand hand-second" x1="100" y1="128" x2="100" y2="18"/>
    <circle class="hub" cx="100" cy="100" r="4.5"/>
  </svg>

  <div class="masthead-text">
    <h1>Bad Clock</h1>
    <p class="lede">The time, told <span id="tileCount">many</span> ways. Most of them are unhelpful.</p>
    <p class="readout"><time id="readout"></time></p>
  </div>

  <!-- Icon buttons. Each one's label (data-tip) shows as a tooltip and is
       read out by screen readers; script.js keeps the location one up to date. -->
  <div class="tools" role="toolbar" aria-label="Options">
    <button type="button" id="locationButton" class="icon-btn"
            data-tip="Sundial set for Greenwich. Use my location"
            aria-label="Sundial set for Greenwich. Use my location">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="7"/>
        <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
        <circle class="fill" cx="12" cy="12" r="2"/>
      </svg>
    </button>
    <button type="button" id="pickButton" class="icon-btn" aria-pressed="false"
            data-tip="Show tiles side by side" aria-label="Show tiles side by side">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="3" width="7.5" height="7.5" rx="1"/>
        <rect x="13.5" y="3" width="7.5" height="7.5" rx="1"/>
        <rect x="3" y="13.5" width="7.5" height="7.5" rx="1"/>
        <rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1"/>
      </svg>
    </button>
    <button type="button" id="shuffleButton" class="icon-btn"
            data-tip="Shuffle through the tiles full page" aria-label="Shuffle through the tiles full page">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 7h3c2.2 0 3.4 1.2 4.5 3l3 4c1.1 1.8 2.3 3 4.5 3h3M3 17h3c2.2 0 3.4-1.2 4.5-3M13.5 10c1.1-1.8 2.3-3 4.5-3h3M18 4l3 3-3 3M18 14l3 3-3 3"/>
      </svg>
    </button>
  </div>

  <div class="time-travel">
      <label for="timeInput">Show the clock at</label>
      <div class="time-travel-row">
        <input type="datetime-local" id="timeInput" step="1">
        <button type="button" id="timeNowButton" class="btn" disabled>Back to now</button>
      </div>
      <p id="timeStatus" class="time-status">Showing the live time. Click a tile to see how it works.</p>
  </div>
</header>

<main>
  <div class="grid" id="gridContainer"></div>
</main>

<dialog id="modal" class="modal" aria-labelledby="modalTitle" tabindex="-1">
  <div class="modal-inner">
    <div class="modal-head">
      <h2 id="modalTitle"></h2>
      <div class="modal-actions">
        <button type="button" id="fullPageButton" class="btn">Full page</button>
        <button type="button" id="closeModal" class="btn btn-quiet">Close</button>
      </div>
    </div>
    <p id="modalDescription"></p>
    <a id="modalLink" class="modal-link" target="_blank" rel="noopener">Read more about it</a>
    <div class="code-block">
      <div class="code-bar">
        <span>How it's worked out</span>
        <div class="code-actions">
          <button type="button" id="copyTimeButton" class="btn">Copy time</button>
          <button type="button" id="copyCodeButton" class="btn btn-primary">Copy code</button>
        </div>
      </div>
      <pre><code id="codeSnippet"></code></pre>
    </div>
    <p class="key-hint">Use ← and → to see the other tiles.</p>
  </div>
</dialog>

<dialog id="focusView" class="focus-view" aria-labelledby="focusName" tabindex="-1">
  <div class="focus-bar">
    <h2 id="focusName" class="focus-name"></h2>
    <button type="button" id="focusClose" class="btn">Back to all tiles</button>
  </div>
  <!-- One pane per tile shown (up to 4), built by script.js from the template below -->
  <div id="focusStage" class="focus-stage"></div>
  <div class="focus-foot">
    <p id="focusReadout" class="focus-readout"></p>
    <p id="focusHint" class="key-hint">Use ← and → to change tile</p>
  </div>
</dialog>

<template id="paneTemplate">
  <div class="pane">
    <svg class="focus-icon" viewBox="0 0 32 32" aria-hidden="true" hidden></svg>
    <span class="focus-value"></span>
  </div>
</template>

<!-- Shown while picking tiles to put side by side -->
<div id="pickBar" class="pick-bar" hidden>
  <p id="pickCount" class="pick-count" aria-live="polite"></p>
  <div class="pick-actions">
    <button type="button" id="pickCancel" class="btn">Cancel</button>
    <button type="button" id="pickShow" class="btn btn-primary" disabled>Show full page</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
